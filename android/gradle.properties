# android/gradle.properties

# اجعل القيم معقولة حتى لا يفشل الـ daemon أو يحصل swap
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ثبّت Kotlin ليُجمِّع داخل العملية بدل daemon (يُنهي رسالة failed connecting)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# تحسينات Gradle العامة (أكثر ثباتًا على ويندوز)
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.parallel=true
# لو جهازك ضعيف، قلّل عدد العمال:
# org.gradle.workers.max=2

# (اختياري) توصية أندرويد حديثة
android.nonTransitiveRClass=true
