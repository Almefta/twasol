name: Flutter CI

on:
  push:
    branches: [ "dev", "main", "feature/**", "ci/**" ]
  pull_request:
    branches: [ "dev", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 مطلوبة لـ AGP الحديثة
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # تثبيت مكونات SDK الشائعة لتفادي أخطاء platform/build-tools
      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" || true

      - name: Doctor (verbose)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      # التحليل غير مُعيق مؤقتًا (سنشدد لاحقًا بعد تنظيف التحذيرات)
      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (if any)
        run: |
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            flutter test -v
          else
            echo "No tests found, skipping."
          fi

      # بناء APK عبر Gradle مباشرة لظهور سبب الخطأ بوضوح
      - name: Build Android (debug, verbose + stacktrace)
        working-directory: android
        run: |
          ./gradlew --version
          ./gradlew app:assembleDebug --stacktrace --warning-mode all --no-daemon

      # رفع الـAPK الناتج كـ Artifact
      - name: Upload APK artifact (if exists)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
        working-directory: android
